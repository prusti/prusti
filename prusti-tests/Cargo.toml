[package]
name = "prusti-tests"
version = "0.2.0"
authors = ["Prusti Devs <prusti_developers@sympa.ethz.ch>"]
edition = "2021"

[dev-dependencies]
prusti-server = { path = "../prusti-server" }
# Builds the Prusti binaries that the tests run, and the contracts they use.
prusti-contracts-build = { path = "../prusti-contracts-build" }
env_logger = "0.10"
ui_test = "0.30.7"
ctrlc = "3.4"
regex = "1.11"

[[test]]
name = "main"
harness = false
