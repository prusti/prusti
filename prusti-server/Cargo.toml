[package]
name = "prusti-server"
version = "0.1.0"
authors = ["Prusti Devs <prusti_developers@sympa.ethz.ch>"]
edition = "2021"
license = "MPL-2.0"
description = "Server-side logic & handling for Prusti"

[lib]
test = true # we have unit tests
doctest = false # but no doc tests

[[bin]]
name = "prusti-server-driver"
path = "src/driver.rs"
test = false
doctest = false

[dependencies]
log = { version = "0.4", features = ["release_max_level_info"] }
vir = { path = "../vir" }
ide = { path = "../ide" }
viper = { path = "../viper" }
prusti-encoder = { path = "../prusti-encoder" }
prusti-interface = { path = "../prusti-interface" }
prusti-viper = { path = "../prusti-viper" }
prusti-utils = { path = "../prusti-utils" }
prusti-rustc-interface = { path = "../prusti-rustc-interface" }
viper-sys = { path = "../viper-sys" }
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
bincode = "1.0"
url = "2.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
jni = { version = "0.20", features = ["invocation"] }
# the tungstenite version used by warp 0.3.7
tokio-tungstenite = "0.21"
futures = "0.3.25"
futures-util = "0.3.25"
async-stream = "0.3.3"
warp = "0.3.7"
tokio = { version = "1.20", features = ["io-util", "net", "rt", "sync"] }
