[workspace]
members = [
    #"analysis",
    "jni-gen",
    "prusti",
    "prusti-contracts-build",
    "prusti-encoder",
    "prusti-tests",
    "prusti-utils",
    "prusti-viper",
    "tracing",
    #"mir-ssa-analysis",
    "pcg",
    "prusti-interface",
    "prusti-server",
    "prusti-launch",
    "prusti-smt-solver",
    "prusti-rustc-interface",
    "smt-log-analyzer",
    "task-encoder",
    # "test-crates",
    "viper",
    # "viper-defs",
    "viper-sys",
    "vir",
    "vir-proc-macro",
    "ide"
]
exclude = [
    "docs/dummy"
]
# Resolver 1 enables the same features of a dependency for normal, build and dev-dependencies,
# so `cargo build` and `cargo test` share one build of the workspace. Together with
# `resolver.feature-unification` in `.cargo/config.toml`, the features do not depend on the
# command or the selected packages. The release build and the CI job that builds each package
# on its own switch to resolver 2 (`.github/actions/resolve-features-separately`).
resolver = "1"

[profile.dev]
debug = 1

# Build scripts, proc macros and their dependencies get the same debuginfo as the other
# crates. A proc macro that a command builds as a package of its own (e.g. `vir-proc-macro`
# in `cargo build --all`) is then the same build as when it is only a dependency, so that
# `cargo test` after `cargo build --all` does not compile it and its dependents again.
[profile.dev.build-override]
debug = 1

[profile.test]
debug = 1

[profile.release]
# Enable after fixing https://github.com/prusti/prusti/issues/383
# lto = true
codegen-units = 1
# Enable when profiling
# debug = true
